[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "glada"
version = "0.1.0"
description = "Grouped Layer Adversarial Domain Adaptation for Audio Deepfake Detection"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "transformers",
    "soundfile",
    "librosa",
    "scikit-learn",
    "scipy",
    "numpy",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["glada*"]
